<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My first Web Page</title>
  <!--This links the CSS file to this HTML file-->
  <link rel="stylesheet" href="style.css">
</head> 


<body>
     
    <div class="card">
    <h1>Welcome to My Website</h1>
    <p><em>This is a simple paragraph styled with CSS.</em></p>
      
    <a href="https://Youtube.com" target="_blank">
    <button class="btn"><b>Click me, baby!</b></button>
    </a>
    </div>
  
</body>
</html>
    
  <style>
/* Style the entire page background and font */
body {
 font-family: Arial, sans-serif;
 background: -webkit-linear-gradient(left, black, white);
 margin: 0;
 padding: 40px;
}

/* Style the container card */
.card {
 background-color: darkblue;
 max-width: 300px;
 margin: 100;
 padding: 20px;
 border-radius: 40px;
 box-shadow: 20px 30px rgba(0, 0 ,0, 0.5);
 text-align: center;
  
 
 position: relative;
 left: 0px;
 
 
}

/* Style the heading */
h1 { 
    color: greenyellow;
    font-size: 15px;
    font-family: Arial, serif;

}

/* Style the paragraph */
p {
    color: white;
    font-size: 10px;
    line-height: 4.5;
    font-family: JOKERMAN, cursive;
}

/* Style the button */
.btn {
    background-color: yellow;
    color: red;
    border: none;
    padding: 10px 20px;
    border-radius: 100px;
    cursor: pointer;
    font-size: 20px;
}

/* Add a hover effect to the button */
.btn:hover {
    background-color: Darkred;
}
  
 </style>
  

  
</body>
</html>
